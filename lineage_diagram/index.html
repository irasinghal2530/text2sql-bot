const TL={report:'Bot report',derived:'Built in ADW',copy:'Copied from Lighthouse',seed:'Oracle standard'};
const SH2={'MIGRATED':'migrated','NOT MIGRATED':'not migrated'};
const cut=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nodeEl={};
ids.forEach(i=>{const n=N[i],x=xy[i][0],y=xy[i][1];
const g=el('g',{'class':'nd '+n.type,tabindex:0,role:'button','aria-label':n.name},ng);
el('rect',{x:x,y:y,width:W,height:H,rx:8},g);
el('text',{x:x+12,y:y+19,'class':'n1'},g).textContent=cut(n.name,30);
el('text',{x:x+12,y:y+35,'class':'n2'},g).textContent=n.type==='report'?cut(n.sub.replace(' > ',' › '),36):TL[n.type]+(n.status?' · '+(SH2[n.status]||'not in sheet'):'');
if(n.status)el('circle',{cx:x+W-14,cy:y+14,r:5,'class':'dot '+(n.status==='MIGRATED'?'ok':n.status==='NOT MIGRATED'?'bad':'na')},g);
if(n.notes.length)el('text',{x:x+W-14,y:y+38,'class':'flag','text-anchor':'middle'},g).textContent='!';
g.onclick=ev=>{ev.stopPropagation();pick(i)};g.onkeydown=ev=>{if(ev.key==='Enter')pick(i)};nodeEl[i]=g});
function reach(i,m){const s=new Set([i]),q=[i];while(q.length){m[q.pop()].forEach(x=>{if(!s.has(x)){s.add(x);q.push(x)}})}return s}
const P=document.getElementById('panel');
const cnt=t=>ids.filter(i=>N[i].type===t).length,rep=ids.filter(i=>N[i].type==='report');
const blocked=rep.filter(i=>[...reach(i,out)].some(k=>N[k].status==='NOT MIGRATED')).length,flagged=ids.filter(i=>N[i].notes.length).length;
const home='<h2>At a glance</h2><p class="mut">Pick a box to see its path and details.</p><div class="blk"><ul><li>'+rep.length+' bot report rows</li><li>'+cnt('derived')+' tables built in ADW</li><li>'+(cnt('copy')+cnt('seed'))+' copied source tables</li><li>'+blocked+' reports with unmigrated upstream tables</li><li>'+flagged+' items to check (marked with !)</li></ul></div>';
const chip=i=>'<button class="lk" data-i="'+esc(i)+'">'+esc(N[i].name)+'</button>';
function pick(i){const up=reach(i,out),dn=reach(i,inn),all=new Set([...up,...dn]);
ids.forEach(k=>{nodeEl[k].classList.toggle('dim',!all.has(k));nodeEl[k].classList.toggle('sel',k===i)});
ep.forEach(([a,b,p])=>{const on=(dn.has(a)&&dn.has(b))||(up.has(a)&&up.has(b));p.classList.toggle('hi',on);p.classList.toggle('dim',!on)});
const n=N[i],bl=[...up].filter(k=>N[k].status==='NOT MIGRATED');
let h='<h2>'+esc(n.name)+'</h2><p class="mut">'+TL[n.type]+(n.sub?' · '+esc(n.sub.replace(' > ',' › ')):'')+(n.status?' · '+n.status.toLowerCase():'')+'</p>';
if(n.notes.length)h+='<div class="blk warn"><b>Check</b><ul>'+n.notes.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
if(out[i].length)h+='<div class="blk"><b>Built from</b>'+out[i].map(chip).join('')+'</div>';
if(inn[i].length)h+='<div class="blk"><b>Feeds</b>'+inn[i].map(chip).join('')+'</div>';
else if(n.type!=='report')h+='<div class="blk warn"><b>Check</b>No bot report uses this yet.</div>';
if(up.size>1)h+=bl.length?'<div class="blk bad"><b>Blocked by '+bl.length+' unmigrated</b>'+bl.map(chip).join('')+'</div>':'<div class="blk ok"><b>Everything upstream is migrated</b></div>';
if(n.sections.length)h+='<div class="blk"><b>Used in Lighthouse ('+n.sections.length+')</b><ul>'+n.sections.slice(0,8).map(s=>'<li>'+esc(s.replace(/ > /g,' › '))+'</li>').join('')+(n.sections.length>8?'<li>+'+(n.sections.length-8)+' more</li>':'')+'</ul></div>';
P.innerHTML=h;P.querySelectorAll('.lk').forEach(b=>b.onclick=()=>pick(b.dataset.i))}
function reset(){ids.forEach(k=>nodeEl[k].classList.remove('dim','sel'));ep.forEach(([a,b,p])=>p.classList.remove('dim','hi'));P.innerHTML=home}
document.getElementById('rs').onclick=reset;svg.onclick=reset;reset();
</script></body></html>
